name: Build Dabbarha APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Build web
        run: |
          npm run build || npx vite build || echo "no build script"

      - name: Create Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix duplicate resources
        run: |
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          rm -f android/app/src/main/res/values/dabbarha_colors.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dabbarha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
