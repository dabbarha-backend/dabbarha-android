name: Build Dabbarha APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            npx vite build
          fi

      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix duplicate color error
        run: |
          echo "Fixing duplicate ic_launcher_background..."
          rm -f android/app/src/main/res/values/ic_launcher_background.xml
          rm -f android/app/src/main/res/values/dabbarha_colors.xml
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#242424</color>
              <color name="colorPrimaryDark">#242424</color>
              <color name="colorAccent">#ff8c00</color>
              <color name="ic_launcher_background">#242424</color>
          </resources>
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dabbarha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
