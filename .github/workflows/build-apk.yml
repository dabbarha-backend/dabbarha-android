name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      - run: npm install --legacy-peer-deps
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
      - run: npx @capacitor/cli add android || true
      - run: npx @capacitor/cli copy android
      - run: npx @capacitor/cli sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dabbarha-complete-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
