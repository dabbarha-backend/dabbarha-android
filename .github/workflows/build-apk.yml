name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor 7
        run: |
          npm install @capacitor/core@7.6.9 @capacitor/cli@7.6.9 @capacitor/android@7.6.8

      - name: Create Android project
        run: npx cap add android

      - name: Fix Android launcher resources
        run: |
          mkdir -p android/app/src/main/res/values
          if [ ! -f android/app/src/main/res/values/colors.xml ]; then
            cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#D4AF37</color>
          </resources>
          EOF
          elif ! grep -q 'name="ic_launcher_background"' android/app/src/main/res/values/colors.xml; then
            sed -i '/<\/resources>/i\    <color name="ic_launcher_background">#D4AF37</color>' android/app/src/main/res/values/colors.xml
          fi

      - name: Copy app files
        run: npx cap copy

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dabbharha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
