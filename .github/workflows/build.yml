name: Build Dabbarha Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Fix and Build
        run: |
          ls -la
          echo "--- searching package.json ---"
          find . -type f -name "package.json" | head -20
          PKG=$(find . -type f -name "package.json" | head -1)
          echo "Found: $PKG"
          if [ -n "$PKG" ]; then
            DIR=$(dirname "$PKG")
            echo "Dir is: $DIR"
            if [ "$DIR" != "." ]; then
              echo "Copying files from $DIR to root..."
              cp -r $DIR/* . 
              cp -r $DIR/.* . 2>/dev/null || true
              ls -la
            fi
          fi
          npm install
          npm run build --if-present
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dabbarha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
