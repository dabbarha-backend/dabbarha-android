name: Build Dabbarha Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Dabbarha com.dabbarha.app --web-dir=. --npm-client=npm
          npx cap add android
          mkdir -p android/app/src/main/assets/public
          cp *.html android/app/src/main/assets/public/ 2>/dev/null || true
          echo "<h1>Dabbarha App</h1>" > android/app/src/main/assets/public/index.html
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dabbarha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
