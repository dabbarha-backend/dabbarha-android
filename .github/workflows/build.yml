name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install and Generate GOLDEN Icon
        run: |
          npm install
          npm install @capacitor/assets --save-dev
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000'
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-golden-Fplus
          path: android/app/build/outputs/apk/debug/app-debug.apk
