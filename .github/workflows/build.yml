name: Build Dabbarha Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Fix project structure
        run: |
          ls -la
          if [ ! -f package.json ]; then
            echo "package.json not in root, searching..."
            PKG=$(find . -name "package.json" | head -1)
            echo "Found: $PKG"
            DIR=$(dirname "$PKG")
            if [ "$DIR" != "." ]; then
              cp -r $DIR/* . || true
              cp -r $DIR/.* . || true
              ls -la
            fi
          fi
      - run: npm install
      - run: npm run build --if-present
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dabbarha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
