<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src * 'self' data: blob: https://* http://* 'unsafe-inline' 'unsafe-eval'">
<title>دبرها</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.header{background:#020617;padding:12px;text-align:center;border-bottom:1px solid #1e293b}
.header h1{color:#facc15;font-size:15px;margin:0}
.chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;font-size:14px;line-height:1.6;background:#1e293b;border:1px solid #334155}
.user{align-self:flex-start;background:#422006;border-color:#facc15}
.ai{align-self:flex-end}
.msg img{width:100%;border-radius:8px;margin-top:6px}
.inputBox{display:flex;gap:6px;padding:10px;background:#020617}
.inputBox input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid #334155;background:#1e293b;color:#fff;outline:none}
.inputBox button{background:#facc15;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>⚡ دبرها - شغال 100% بدون موتور</h1></div>
<div id="chat" class="chat">
<div class="msg ai">✅ التطبيق فتح!<br>جرب تكتب: كيف انظم وقت دراستي؟</div>
</div>
<div class="inputBox">
<input id="inp" placeholder="اسأل هنا..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">↑</button>
</div>

<script>
async function send(){
 let input=document.getElementById('inp');
 let text=input.value.trim();
 if(!text) return;
 let box=document.getElementById('chat');
 box.innerHTML+=`<div class="msg user">${text}</div>`;
 input.value='';
 box.scrollTop=box.scrollHeight;

 // لو طلب صورة
 if(/صمم|صور|صورة|ارسم|cat|قط|بيت|house|image|draw|رسم/i.test(text)){
   let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=512&height=512&nologo=true&seed=${Date.now()}`;
   box.innerHTML+=`<div class="msg ai">🎨 بصمم ليك...<br><img src="${url}" onload="document.getElementById('chat').scrollTop=99999"></div>`;
   return;
 }

 let id='a'+Date.now();
 box.innerHTML+=`<div id="${id}" class="msg ai">⏳ بفكر...</div>`;
 box.scrollTop=box.scrollHeight;

 try{
   // نستخدم API مجاني بدون مفتاح - يشتغل في التطبيق
   let prompt = `أنت دبرها مساعد سوداني ذكي، جاوب باختصار مفيد بنفس لغة المستخدم. السؤال: ${text}`;
   let res = await fetch('https://text.pollinations.ai/openai', {
     method: 'POST',
     headers: {'Content-Type':'application/json'},
     body: JSON.stringify({
       messages: [{role:'user', content: prompt}],
       model: 'openai',
       stream: false
     })
   });

   let data = await res.json();
   let reply = data.choices?.[0]?.message?.content || data.content || JSON.stringify(data);

   document.getElementById(id).textContent = reply;

 }catch(e){
   // لو فشل، جرب طريقة تانية
   try{
     let p = encodeURIComponent(text);
     let r2 = await fetch(`https://text.pollinations.ai/${p}?model=openai`);
     let t2 = await r2.text();
     document.getElementById(id).textContent = t2;
   }catch(e2){
     document.getElementById(id).innerHTML = `❌ ما قدر يتصل:<br>${e2}<br><br>تأكد النت شغال وجرب تاني`;
   }
 }
 box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
