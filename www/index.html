<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دبرها</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 15% 0%, #0a2a5b 0%, #020a1a 70%);color:white;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;text-align:center;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,195,255,0.2)}
.header h1{color:#FFD700;font-size:20px}
.tabs{display:flex;gap:8px;padding:10px;justify-content:center}
.tab{padding:8px 16px;border-radius:20px;border:1px solid rgba(0,195,255,0.3);background:rgba(0,0,0,0.3);color:#7cc8ff;cursor:pointer}
.tab.active{background:rgba(0,195,255,0.2);color:#00F5FF;border-color:#00F5FF}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:18px;max-width:85%;line-height:1.5;word-break:break-word}
.user{background:rgba(255,215,0,0.15);border:1px solid #FFD700;align-self:flex-start}
.ai{background:rgba(0,20,50,0.9);border:1px solid rgba(0,195,255,0.3);align-self:flex-end}
.msg img{width:100%;border-radius:12px;margin-top:10px}
.inputBox{display:flex;gap:10px;padding:12px;background:rgba(0,0,0,0.5);border-top:1px solid rgba(0,195,255,0.2)}
.inputBox input{flex:1;padding:12px 18px;border-radius:25px;border:1px solid rgba(0,195,255,0.3);background:rgba(0,20,50,0.8);color:white;outline:none}
.inputBox button{background:#FFD700;color:black;border:none;width:48px;height:48px;border-radius:50%;font-weight:bold;cursor:pointer}
.page{display:none;flex:1;overflow-y:auto;padding:15px}
.page.active{display:flex;flex-direction:column}
.card{background:rgba(0,20,50,0.6);border:1px solid rgba(0,195,255,0.2);padding:15px;border-radius:15px;margin-bottom:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header"><h1>⚡ دبرها - الذكاء السوداني</h1>
<div class="tabs">
<button class="tab active" onclick="show('ai',this)">🧠 المساعد</button>
<button class="tab" onclick="show('people',this)">💬 الناس</button>
<button class="tab" onclick="show('games',this)">🎮 أوفلاين</button>
</div></div>

<div id="ai" class="page active" style="display:flex"><div id="aiChat" class="chat"></div></div>
<div id="people" class="page"><div id="peopleChat" class="chat"></div></div>
<div id="games" class="page">
<div class="card"><h3>🎮 خمن الرقم (أوفلاين)</h3><p id="gText">خمنت رقم من 1-100، ورينا شطارتك!</p><div style="display:flex;gap:10px;margin-top:10px"><input id="gInput" type="number" placeholder="خمن" style="flex:1;padding:10px;border-radius:10px;border:none"><button onclick="guess()" style="background:#FFD700;padding:10px 20px;border-radius:10px;border:none">جرب</button></div></div>
<div class="card"><h3>🧩 لغز أوفلاين</h3><p>ما هو الشيء كلما أخذت منه كبر؟<br><b style="color:#00F5FF">الجواب: الحفرة</b></p></div>
</div>

<div class="inputBox">
<input id="mainInput" placeholder="اكتب هنا... صمم لي صورة، دبر لي..." onkeypress="if(event.key==='Enter') send()">
<button onclick="send()">⚡</button>
</div>

<script>
let mode='ai';
function show(id,btn){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='flex';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');mode=id; document.getElementById('mainInput').placeholder = id==='people'?'دردش مع الناس...': id==='games'?'العب بدون نت':'اكتب... صمم لي صورة، دبر لي...'}

let secret=Math.floor(Math.random()*100)+1;
function guess(){let v=document.getElementById('gInput').value;let t=document.getElementById('gText');if(!v)return;if(v==secret){t.innerHTML='🎉 مبروك! صح! عملت رقم جديد';secret=Math.floor(Math.random()*100)+1}else if(v>secret)t.textContent='👇 أقل';else t.textContent='👆 أكتر';document.getElementById('gInput').value=''}

let peopleMsgs=JSON.parse(localStorage.getItem('dabbarha_people')||'[]');
function renderPeople(){let c=document.getElementById('peopleChat');c.innerHTML=peopleMsgs.map(m=>`<div class="msg ${m.me?'user':'ai'}">${m.text}<br><small style="color:#00F5FF88;font-size:11px">${m.time}</small></div>`).join('');c.scrollTop=c.scrollHeight}

async function send(){
 let input=document.getElementById('mainInput');let text=input.value.trim();if(!text)return;
 let box = mode==='ai' ? document.getElementById('aiChat') : document.getElementById('peopleChat');
 box.innerHTML+=`<div class="msg user">${text}</div>`;input.value='';box.scrollTop=box.scrollHeight;

 if(mode==='people'){
   let time=new Date().toLocaleTimeString('ar-SD',{hour:'2-digit',minute:'2-digit'});
   peopleMsgs.push({text,me:true,time});localStorage.setItem('dabbarha_people',JSON.stringify(peopleMsgs));renderPeople();
   // TODO: هنا نربط Supabase عشان يبقى أونلاين حقيقي بين كل الناس
   return;
 }

 // AI MODE - ذكي حقيقي زيي
 if(text.includes('صمم')||text.includes('صورة')||text.includes('ارسم')||text.includes('image')){
   let id='img'+Date.now();box.innerHTML+=`<div id="${id}" class="msg ai">🎨 بصمم ليك هسي ثواني...<br><img src="https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=512&height=512&nologo=true" onload="document.getElementById('${id}').scrollIntoView()"></div>`;
 }else{
   let id='ai'+Date.now();box.innerHTML+=`<div id="${id}" class="msg ai">⏳ دبرها بيفكر...</div>`;
   try{
     let prompt=encodeURIComponent(`أنت مساعد سوداني اسمه دبرها، ذكي، بترد باللهجة السودانية العامية الخفيفة، باختصار ومفيد، ساعد المستخدم: ${text}`);
     let res=await fetch(`https://text.pollinations.ai/${prompt}`);
     let reply=await res.text();
     let el=document.getElementById(id); el.textContent=''; let i=0;
     let iv=setInterval(()=>{el.textContent=reply.slice(0,i++); box.scrollTop=box.scrollHeight; if(i>reply.length)clearInterval(iv)},15);
   }catch(e){document.getElementById(id).textContent='النت ضعيف، حاول تاني';}
 }
 box.scrollTop=box.scrollHeight;
}
renderPeople();
</script>
</body>
</html>
