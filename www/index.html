<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دبّرها ✨</title>


<style>
:root{
  --bg:#f7f8fc;
  --card:#ffffff;
  --text:#172033;
  --muted:#697386;
  --primary:#6c5ce7;
  --primary2:#8e7dff;
  --cyan:#20c7d9;
  --pink:#ff6b9a;
  --green:#21c77a;
  --shadow:0 12px 32px rgba(39,32,92,.10);
  --radius:22px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(142,125,255,.18),transparent 28%),
    radial-gradient(circle at 95% 10%,rgba(32,199,217,.15),transparent 25%),
    var(--bg);
  color:var(--text);
}
.app{max-width:620px;margin:auto;padding:18px 16px 92px}
.header{
  color:#fff;
  padding:22px;
  border-radius:28px;
  background:linear-gradient(135deg,#5d4bd8 0%,#7d68f3 52%,#20c7d9 120%);
  box-shadow:0 18px 38px rgba(83,68,196,.28);
  position:relative;overflow:hidden;
}
.header:after{
  content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  right:-45px;top:-60px;background:rgba(255,255,255,.13);
}
.brand{font-size:30px;font-weight:900;letter-spacing:-1px}
.tag{margin-top:5px;opacity:.92;font-size:14px}
.search{
  margin-top:18px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:8px;
  display:flex;gap:8px;backdrop-filter:blur(8px)
}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:white;
  padding:12px;font-size:15px
}
.search input::placeholder{color:rgba(255,255,255,.78)}
.btn{
  border:0;border-radius:15px;padding:12px 18px;font-weight:800;cursor:pointer;
  background:white;color:#5d4bd8;box-shadow:0 6px 15px rgba(0,0,0,.12)
}
.section-title{font-size:19px;font-weight:900;margin:24px 3px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  background:var(--card);border:1px solid rgba(80,72,130,.07);
  border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);
  transition:.18s transform,.18s box-shadow;cursor:pointer
}
.card:active{transform:scale(.98)}
.icon{
  width:48px;height:48px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:25px;margin-bottom:11px
}
.card h3{margin:0 0 5px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.purple{background:#eeeaff}.cyan{background:#e5fbfe}.pink{background:#ffe8f0}
.green{background:#e6fbf1}.orange{background:#fff1df}.blue{background:#e8f0ff}
.hero{
  margin-top:18px;padding:20px;border-radius:24px;background:linear-gradient(135deg,#fff,#f1efff);
  border:1px solid #e8e3ff;box-shadow:var(--shadow)
}
.hero h2{margin:0 0 7px;font-size:20px}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.primary-action{
  width:100%;margin-top:14px;padding:14px;border:0;border-radius:17px;
  color:#fff;font-weight:900;font-size:15px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 10px 22px rgba(108,92,231,.25)
}
.bottom{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:min(590px,calc(100% - 24px));background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);border:1px solid rgba(80,72,130,.10);
  box-shadow:0 12px 30px rgba(25,22,60,.14);border-radius:22px;
  display:flex;justify-content:space-around;padding:9px 6px;z-index:10
}
.nav{font-size:11px;color:#778093;text-align:center;padding:5px 13px;border-radius:14px}
.nav.active{color:var(--primary);font-weight:900;background:#f0edff}
.plan{
  margin-top:15px;background:white;border-radius:20px;padding:17px;box-shadow:var(--shadow);
  border-right:4px solid var(--primary)
}
.plan ol{margin:10px 0 0;padding-right:22px}
.plan li{margin:8px 0;color:#4d5668;font-size:13px}
@media(max-width:390px){.grid{gap:9px}.card{padding:14px}.brand{font-size:27px}}
</style>

<style id="premium-8k-theme">
:root{
 --bg:#080a14;--panel:#111528;--panel2:#171b31;--text:#f7f7ff;--muted:#a9afc4;
 --violet:#8b6cff;--cyan:#36d9e8;--pink:#ff6fae;--gold:#f5c76a;
}
body{
 background:
 radial-gradient(700px 380px at 5% -5%,rgba(139,108,255,.30),transparent 60%),
 radial-gradient(600px 360px at 100% 5%,rgba(54,217,232,.20),transparent 60%),
 radial-gradient(500px 400px at 50% 100%,rgba(255,111,174,.10),transparent 65%),
 var(--bg)!important;color:var(--text)!important;
}
.app{max-width:680px;padding:20px 16px 104px}
.header{
 background:linear-gradient(135deg,#20194f 0%,#37266e 38%,#126474 100%)!important;
 border:1px solid rgba(255,255,255,.14);
 box-shadow:0 24px 70px rgba(83,57,190,.30),inset 0 1px 0 rgba(255,255,255,.12)!important;
 padding:25px!important;
}
.header:before{
 content:"";position:absolute;inset:-80px auto auto -90px;width:220px;height:220px;border-radius:50%;
 background:rgba(255,255,255,.08);filter:blur(3px);
}
.brand{font-size:34px!important;text-shadow:0 3px 18px rgba(255,255,255,.20)}
.tag{font-size:15px!important}
.search{
 background:rgba(5,7,18,.25)!important;border-color:rgba(255,255,255,.20)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
}
.search input{color:#fff!important}
.btn{background:linear-gradient(135deg,#fff,#e9e5ff)!important;color:#4431a8!important}
.section-title{color:#fff!important;font-size:20px!important}
.card{
 background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035))!important;
 border:1px solid rgba(255,255,255,.11)!important;
 box-shadow:0 18px 42px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.06)!important;
 color:#fff!important;
}
.card p{color:#aeb5ca!important}
.icon{box-shadow:0 8px 20px rgba(0,0,0,.15)}
.hero{
 background:linear-gradient(145deg,rgba(139,108,255,.17),rgba(54,217,232,.07))!important;
 border:1px solid rgba(139,108,255,.25)!important;
 box-shadow:0 20px 48px rgba(0,0,0,.22)!important;
 color:#fff!important;
}
.hero p{color:#b5bbce!important}
.primary-action{
 background:linear-gradient(135deg,#8b6cff,#36d9e8)!important;
 box-shadow:0 14px 30px rgba(90,77,220,.34)!important;
 text-shadow:0 1px 4px rgba(0,0,0,.15)
}
.bottom{
 background:rgba(14,17,31,.88)!important;
 border-color:rgba(255,255,255,.12)!important;
 box-shadow:0 18px 45px rgba(0,0,0,.35)!important
}
.nav{color:#8f96ad!important}
.nav.active{color:#fff!important;background:rgba(139,108,255,.20)!important}
.plan{
 background:linear-gradient(145deg,#13172a,#0e1120)!important;
 color:#fff!important;border-right-color:#8b6cff!important
}
.plan li{color:#bdc2d2!important}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">دبّرها ✨</div><div class="tag">مشكلتك؟ دبّرها.</div></header>

<div class="card">
<div class="ask">
<input id="q" placeholder="اكتب مشكلتك أو سؤالك...">
<button class="primary" onclick="solve()">دبّرها</button>
</div>
<div id="result" class="result"></div>
</div>

<div class="card">
<h2>ماذا تريد أن تدبّر؟</h2>
<div class="grid">
<button class="tool" onclick="openTool('المال والعمل')"><span class="icon">💰</span>المال والعمل<br><span class="muted">أفكار وخطوات عملية</span></button>
<button class="tool" onclick="openTool('الدراسة')"><span class="icon">📚</span>الدراسة<br><span class="muted">خطط وتنظيم</span></button>
<button class="tool" onclick="openTool('المستندات')"><span class="icon">📄</span>المستندات<br><span class="muted">افهم ورقتك</span></button>
<button class="tool" onclick="openTool('الترجمة')"><span class="icon">🌐</span>الترجمة<br><span class="muted">ترجمة النصوص</span></button>
<button class="tool" onclick="openTool('تصوير مستند')"><span class="icon">📷</span>تصوير مستند<br><span class="muted">تحليل الصورة</span></button>
<button class="tool" onclick="openTool('خططي المحفوظة')"><span class="icon">💾</span>خططي المحفوظة<br><span class="muted">خططك السابقة</span></button>
</div>
</div>

<div class="card">
<h2>كيف يعمل دبّرها؟</h2>
<p class="muted">اكتب مشكلتك أو اختر قسمًا، وسيساعدك التطبيق على تحويلها إلى خطوات واضحة وعملية.</p>
</div>
</div>

<nav>
<button class="active">🏠<br>الرئيسية</button>
<button onclick="openTool('دبّرها')">🤖<br>دبّرها</button>
<button onclick="openTool('تصوير مستند')">📷<br>تصوير</button>
<button onclick="openTool('خططي المحفوظة')">💾<br>خططي</button>
</nav>

<div id="modal" class="modal">
<div class="sheet">
<button class="close" onclick="closeTool()">إغلاق</button>
<h2 id="title"></h2>
<p class="muted">اكتب التفاصيل وسنرتبها لك.</p>
<textarea id="input" placeholder="اكتب هنا..."></textarea><br><br>
<button class="primary" onclick="makePlan()">إنشاء خطة</button>
<div id="toolResult" class="result"></div>
</div>
</div>

<script>
function solve(){
 const q=document.getElementById('q').value.trim(),r=document.getElementById('result');
 r.style.display='block';
 r.textContent=q?
 'خطة مبدئية لمشكلتك:\n\n1. حدّد الهدف المطلوب.\n2. اجمع المعلومات والمستندات اللازمة.\n3. ابدأ بأبسط خطوة اليوم.\n4. راجع النتيجة وحدد الخطوة التالية.\n\nالمشكلة: '+q:
 'اكتب مشكلتك أولًا.';
}
function openTool(name){
 document.getElementById('title').textContent=name;
 document.getElementById('input').value='';
 document.getElementById('toolResult').style.display='none';
 document.getElementById('modal').style.display='flex';
}
function closeTool(){document.getElementById('modal').style.display='none'}
function makePlan(){
 const v=document.getElementById('input').value.trim(),r=document.getElementById('toolResult');
 r.style.display='block';
 r.textContent=v?
 'خطتك المبدئية:\n\n1. افهم المطلوب.\n2. جهّز المعلومات اللازمة.\n3. نفّذ أول خطوة.\n4. احفظ النتيجة وانتقل للخطوة التالية.':
 'أدخل التفاصيل أولًا.';
}
</script>
</body>
</html>
