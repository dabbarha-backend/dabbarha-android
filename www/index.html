<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DABBARHA - دبّرها للملك</title>
<style>
body{margin:0;background:#0B0606;color:#fff;font-family:system-ui;padding:16px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(232,199,102,.2);border-radius:16px;padding:14px}
textarea{width:100%;min-height:100px;background:#111;color:#fff;border:1px solid #E8C766;border-radius:12px;padding:12px;font-size:16px}
.button{width:100%;background:#E8C766;color:#000;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
.result{margin-top:14px;white-space:pre-wrap;line-height:1.7}
.hidden{display:none}
</style>
</head>
<body>
<h2 style="color:#E8C766">دبّرها للملك 👑</h2>
<div class="glass">
<textarea id="problem" placeholder="ما مشكلتك يا ملك؟ اكتب هنا..."></textarea>
<button class="button" id="solveBtn">دبّرها لي ✨</button>
<div id="status" style="margin-top:8px;color:#2ecc71;font-size:13px">موتور دبّرها شغال ✅</div>
</div>
<div id="result" class="result glass hidden"></div>

<script>
const BASE="https://dabbarha-android-4.onrender.com";
const s=id=>document.getElementById(id);

s('solveBtn').onclick=async()=>{
  const problem=s('problem').value.trim();
  if(!problem){ alert('اكتب مشكلتك أول'); return }
  s('solveBtn').textContent='جاري التدبير...⏳';
  s('solveBtn').disabled=true;
  const r=s('result');
  r.classList.remove('hidden');
  r.textContent='بفكر ليك يا ملك...';
  try{
    const res=await fetch(`${BASE}/api/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:problem})
    });
    const data=await res.json();
    r.innerHTML = data.reply || data.answer || JSON.stringify(data);
  }catch(e){
    r.textContent='الموتور صحى من النوم، دوس تاني: '+e;
  }finally{
    s('solveBtn').textContent='دبّرها لي ✨';
    s('solveBtn').disabled=false;
  }
};
</script>
</body>
</html>
