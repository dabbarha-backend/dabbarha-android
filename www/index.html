<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src * data: blob: https: http: 'unsafe-inline' 'unsafe-eval'"><style>body{margin:0;background:#0a0700;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}.page{display:none;flex:1;overflow:auto;padding:10px;background:radial-gradient(#2a1f0a,#070509)}.page.on{display:flex;flex-direction:column}.card{background:linear-gradient(#1e1608,#0e0b05);border:1px solid #facc1566;border-radius:16px;padding:12px;margin:5px}.gold{color:#facc15}.btn{width:100%;padding:12px;background:linear-gradient(90deg,#facc15,#fde68a);color:#000;border:none;border-radius:12px;font-weight:900}.nav{height:60px;background:#000;border-top:1px solid #facc1533;display:flex;justify-content:space-around;align-items:center}.nav div{color:#6b5a2a;font-size:11px;text-align:center}.nav.on{color:#facc15}.chat{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}.msg{padding:10px;border-radius:14px;max-width:85%;font-size:13px;border:1px solid #facc1540;background:#1a1405}.user{align-self:flex-start;background:#3a2a0a}.ai{align-self:flex-end}.msg img{width:100%;border-radius:10px;margin-top:6px}.input{display:flex;gap:6px;padding:10px;background:#000}.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #facc1540;background:#1a1405;color:#fff}.input button{width:44px;height:44px;border-radius:50%;background:#facc15;border:none}</style></head><body>
<div id="p1" class="page on" style="justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at center,#3a2a0a 0%,#000 70%)"><div style="width:140px;height:140px;border-radius:50%;background:radial-gradient(#fde68a,#facc15);display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 0 50px gold;border:4px solid gold;margin-bottom:20px">D</div><h1 class="gold" style="font-size:40px;margin:0">دبّرها</h1><p>DABBARHA</p><small style="color:#fde68a">ذكاء اصطناعي.. لحياة أسهل</small><button class="btn" style="margin-top:30px;width:200px" onclick="go('p2')">ابدأ الآن →</button></div>
<div id="p2" class="page"><h3 class="gold">👑 مرحبا بك في دبرها</h3><div class="card"><input id="hIn" placeholder="اكتب سؤالك هنا..." style="width:100%;padding:10px;border-radius:10px;background:#000;color:#fff;border:1px solid #444"><button class="btn" style="margin-top:6px" onclick="let v=document.getElementById('hIn').value;if(v){go('p3');document.getElementById('q').value=v;send()}">اسأل</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="card">📊 المال والعمل</div><div class="card">📚 الدراسة</div><div class="card">📄 المستندات</div><div class="card">🎭 الترفيه</div><div class="card" onclick="go('p4')">🎨 مولد الصور</div><div class="card" onclick="go('p5')">🎤 الصوتي</div></div><div class="nav"><div class="on">🏠 الرئيسية</div><div onclick="go('p3')">💬 الشات</div><div onclick="go('p4')">🎨 الصور</div></div></div>
<div id="p3" class="page"><div style="display:flex;justify-content:space-between;padding:5px"><span onclick="go('p2')">＜ رجوع</span><b class="gold">المساعد الذكي</b></div><div id="chat" class="chat"><div class="msg ai">مرحبا! أنا دبرها، جاهز أساعدك 👋</div></div><div class="input"><input id="q" placeholder="اكتب رسالتك..."><button onclick="send()">↑</button></div></div>
<div id="p4" class="page"><div onclick="go('p2')">＜ رجوع</div><h3 class="gold">🎨 مولد الصور - شغال 100%</h3><div class="card"><input id="imgP" placeholder="مثلا: منزل سوداني" style="width:100%;padding:10px;border-radius:10px;background:#000;color:#fff;border:1px solid #444"><button class="btn" style="margin-top:6px" onclick="makeImg()">صمم</button></div><div id="imgBox"></div></div>
<div id="p5" class="page"><div onclick="go('p2')">＜ رجوع</div><h3 class="gold">🎤 محادثة صوتية</h3><div style="text-align:center;margin-top:40px"><div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(#facc15,#a16207);margin:auto;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 0 30px gold" onclick="startVoice()">🎤</div><p>دوس للكلام</p><p id="voiceTxt" style="color:#facc15"></p></div></div>
<script>
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on')}
async function send(){let i=document.getElementById('q');let t=i.value.trim();if(!t)return;let c=document.getElementById('chat');c.innerHTML+=`<div class=msg user>${t}</div>`;i.value='';let id='m'+Date.now();c.innerHTML+=`<div id=${id} class="msg ai">⏳...</div>`;c.scrollTop=9999;try{let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}],model:'openai-fast'})});let d=await r.json();document.getElementById(id).textContent=d.choices[0].message.content}catch(e){document.getElementById(id).textContent='حاول تاني - النت ضعيف'};c.scrollTop=9999}
function makeImg(){let p=document.getElementById('imgP').value;if(!p)return;let b=document.getElementById('imgBox');let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;b.innerHTML=`<div class=card><p>🎨 ${p}</p><img src="${u}" onload="this.scrollIntoView()" style="width:100%;border-radius:10px;min-height:200px;background:#111"></div>`+b.innerHTML}
function startVoice(){let t=document.getElementById('voiceTxt');if(!('webkitSpeechRecognition' in window)){t.textContent='المتصفح ما بدعم الصوت';return}let r=new webkitSpeechRecognition();r.lang='ar-SA';r.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;go('p3');send()};r.start();t.textContent='🎧 بسمع... اتكلم هسي'}
</script></body></html>
